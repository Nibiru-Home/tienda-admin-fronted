<div class="container">
  <c-sidebar></c-sidebar>

  <main class="edit-product">
    <c-form-card title="Editar producto">
      @if (isLoading) {
        <div class="edit-product__loading">Cargando producto...</div>
      } @else {
        <form (ngSubmit)="submit()" #editProductForm="ngForm">
          <div class="form-group">
            <label for="name" class="form__label">Nombre</label>
            <input
              id="name"
              type="text"
              class="form__input"
              name="name"
              [(ngModel)]="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="description" class="form__label">Descripción</label>
            <textarea
              id="description"
              class="form__input edit-product__textarea"
              name="description"
              [(ngModel)]="description"
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="price" class="form__label">Precio (€)</label>
            <input
              id="price"
              type="number"
              class="form__input"
              name="price"
              [(ngModel)]="price"
              required
              min="0"
              step="0.01"
            />
          </div>

          <div class="edit-product__row">
            <div class="form-group">
              <label for="categoryId" class="form__label">ID categoría</label>
              <input
                id="categoryId"
                type="number"
                class="form__input"
                name="categoryId"
                [(ngModel)]="categoryId"
                min="1"
                step="1"
              />
            </div>

            <div class="form-group">
              <label for="style" class="form__label">Estilo (opcional)</label>
              <input
                id="style"
                type="text"
                class="form__input"
                name="style"
                [(ngModel)]="style"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="image" class="form__label">Imagen (URL o nombre) </label>
            <input
              id="image"
              type="text"
              class="form__input"
              name="image"
              [(ngModel)]="image"
            />
          </div>

          <div class="edit-product__actions">
            <button type="button" class="edit-product__button" (click)="cancel()">
              Cancelar
            </button>
            <button
              type="submit"
              class="form__button edit-product__button edit-product__button--primary"
              [disabled]="editProductForm.invalid || isSubmitting"
            >
              Guardar
            </button>
          </div>
        </form>
      }
    </c-form-card>
  </main>
</div>
