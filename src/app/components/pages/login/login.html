<div class="login-container">
    <div class="form">
        <div class="form__card">
            <h2 class="form__title">Inicia sesión</h2>
            <div class="form-group">
                <label for="email" class="form__label">Correo electrónico</label>
                <input type="email" id="email" class="form__input" placeholder="Ingresa tu correo" [(ngModel)]="email"
                    name="email">
            </div>
            <div class="form-group">
                <label for="password" class="form__label">Contraseña</label>
                <input type="password" id="password" class="form__input" placeholder="Ingresa tu contraseña"
                    [(ngModel)]="password" name="password">
            </div>
            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>
            <button (click)="login()" class="form__button">Ingresar</button>
        </div>
    </div>
</div>
