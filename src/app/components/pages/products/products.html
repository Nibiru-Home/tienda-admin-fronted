<div class="c-container">
    <c-sidebar></c-sidebar>
    <main class="c-products-content">
        <header class="c-products-header">
            <h1>Gestión de productos</h1>
            <button class="c-btn-new-product" (click)="addProduct()">+ Nuevo producto</button>
        </header>

        @if (categories.length > 0) {
            <section class="c-category-filters">
                <button [class.g--active]="selectedCategory === ''" (click)="filterCategory('')">Todas</button>
                @for (category of categories; track category) {
                    <button [class.g--active]="selectedCategory === category" (click)="filterCategory(category)">
                        {{ category }}
                    </button>
                }
            </section>
        }

        <section class="c-products-grid">
            @for (product of filteredProducts; track product.id) {
                <c-product-card [product]="product" (edit)="editProduct($event)" (view)="viewProduct($event)"
                    (delete)="deleteProduct($event)">
                </c-product-card>
            }
        </section>

        @if (deleteCandidateId !== null) {
            <div class="c-confirm-overlay">
                <div class="c-confirm-dialog" role="dialog" aria-modal="true" aria-label="Confirmar eliminación">
                    <h3 class="c-confirm-dialog__title">Eliminar producto</h3>
                    <p class="c-confirm-dialog__body">¿Estás seguro de borrar este artículo?</p>
                    <div class="c-confirm-dialog__actions">
                        <button type="button" class="c-btn" (click)="cancelDelete()" [disabled]="isDeleting">
                            Cancelar
                        </button>
                        <button type="button" class="c-btn c-btn--confirm-dialog-delete" (click)="confirmDelete()"
                            [disabled]="isDeleting">Eliminar</button>
                    </div>
                </div>
            </div>
        }
    </main>
</div>
