<div class="product-card" (click)="onView()">
    <div class="card-image">
        <img [src]="imageUrl" [alt]="product.name">
    </div>
    <div class="card-body">
        <h3 class="card-title">{{ product.name }}</h3>
        <p class="card-subtitle">{{ product.description }}</p>
        <p class="card-price">{{ product.price }} €</p>
        <div class="card-actions">
            <button class="btn-action" type="button" (click)="onEdit($event)">Editar</button>
            <button class="btn-action" type="button" (click)="onDelete($event)">Eliminar</button>
        </div>
    </div>
</div>
