<div class="c-sidebar l-flex l-flex__direction--column l-flex__align-items--flex-start">

  <div class="c-sidebar__logo">
    <img [src]="'/icons/' + logo" alt="Logo">
  </div>

  @for (item of sideNavItems; track $index) {
    <a
      class="l-flex l-flex__align-items--center"
      [routerLink]="item.route"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
    >
      <img [src]="'/icons/' + item.icon">
      <span>{{ item.name }}</span>
      
    </a>
  }

  <div class="c-sidebar__logout">
    <button type="button" class="c-sidebar__logout-button" (click)="logout()">
      <span>Salir</span>
      <img src="./icons/salida-de-emergencia.png" alt="Salir">
    </button>
  </div>


</div>
